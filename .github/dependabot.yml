version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # This action is pinned to Cargo.toml's MSRV and moves with it.
      - dependency-name: dtolnay/rust-toolchain
