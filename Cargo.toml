[workspace]
members = ["crates/opencegeljaras-core", "crates/opencegeljaras-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_lines = "warn"

[workspace.dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
